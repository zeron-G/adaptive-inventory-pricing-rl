name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run synthetic experiment smoke test
        run: |
          python scripts/run_experiments.py --synthetic --tuning-episodes 4 --final-episodes 8 --evaluation-episodes 3 --reports-dir reports_ci

      - name: Validate generated report tables
        run: |
          test -f reports_ci/tables/evaluation_summary.csv
          test -f reports_ci/figures/training_curve.png
