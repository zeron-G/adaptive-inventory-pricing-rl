[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-inventory-pricing-rl"
version = "0.1.0"
description = "Tabular reinforcement learning for adaptive retail inventory and pricing decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "pypdf>=4.3",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
